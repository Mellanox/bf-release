[Unit]
# RM-5266141: mlnx-bf-hugepages-ready.service (mlnx-tools) is the
# systemd-observable signal that DOCA hugepage configuration has been
# applied. Wants=, not Requires=: if that unit never runs (e.g. Controller
# mode, or mlnx-tools not installed), kubelet must still start normally.
After=mlnx-bf-hugepages-ready.service
Wants=mlnx-bf-hugepages-ready.service
