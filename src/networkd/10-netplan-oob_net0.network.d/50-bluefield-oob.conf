# BlueField: DHCP options for the OOB management interface (oob_net0)
#
# Drop-in for the netplan-generated unit that owns oob_net0 on a stock image
# (/run/systemd/network/10-netplan-oob_net0.network). It only adds DHCP
# options and does not decide whether or how oob_net0 is configured. When
# another unit owns oob_net0 (e.g. HBN's /etc/systemd/network/25-oob-net0.network
# with VRF=mgmt), the parent unit does not exist and this file has no effect.
#
# SendOption=12 works around systemd-networkd suppressing the hostname option
# when the hostname is localhost.localdomain.
[DHCPv4]
VendorClassIdentifier=NVIDIA/BF/OOB
SendHostname=false
SendOption=12:string:localhost.localdomain
