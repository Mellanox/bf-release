# Please note, IPsec full offload requires FW steering,
# Please note that setting IPSEC_FULL_OFFLOAD="yes" will automatically move to FW steering.

IPSEC_FULL_OFFLOAD="no"

# FORCE_DPU_CONFIGURE - Force /sbin/mlnx_bf_configure to run on Controller/JBOF
# platforms. Normally, mlnx_bf_configure detects a Controller device (via the
# host_en register in MMHI) and exits without configuring SFs or OVS bridges.
# Set to "yes" on JBOF systems where DPU-style network configuration (eSwitch
# switchdev mode, SF creation, OVS bridges) is still required despite the device
# being in Controller mode.
# Default: "no"
FORCE_DPU_CONFIGURE="no"

# PARALLEL_SWITCHDEV_ENABLE - Enable parallel switchdev mode transition for
# multiple ECPFs. When set to "yes", mlnx_bf_configure switches all ECPFs to
# switchdev mode concurrently instead of sequentially, reducing boot time on
# multi-ECPF platforms such as BF4. Set to "force" to enable parallel mode
# even when preconditions (e.g. FW support check) would normally prevent it.
# Default: "no"
PARALLEL_SWITCHDEV_ENABLE="no"
